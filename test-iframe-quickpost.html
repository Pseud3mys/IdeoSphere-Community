<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test QuickPost Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1600px;
            margin: 0 auto;
            height: calc(100vh - 40px);
        }

        .widget-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .widget-showcase {
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            padding: 30px;
            border-radius: 12px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .widget-container {
            width: 100%;
            max-width: 600px;
        }

        iframe {
            width: 100%;
            height: 320px;
            border: none;
            display: block;
            background: transparent;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-right: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0;
            color: #1a1a1a;
        }

        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .controls h2 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: #333;
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .control-item label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
        }

        .control-item input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .control-item input[type="text"]:focus {
            outline: none;
            border-color: #0066cc;
        }

        .checkbox-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            font-size: 0.85rem;
            cursor: pointer;
            color: #555;
        }

        .btn-reload {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .btn-reload:hover {
            background: #0052a3;
        }

        .code-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .code-section h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #333;
        }

        .code-block {
            position: relative;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            line-height: 1.4;
            overflow-x: auto;
        }

        .btn-copy {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #0066cc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-copy:hover {
            background: #0052a3;
        }

        .url-display {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            margin-bottom: 12px;
            color: #333;
            max-height: 100px;
            overflow-y: auto;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .controls-section {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="widget-section">
            <h1>Widget QuickPost</h1>
            <div class="widget-showcase">
                <div class="widget-container">
                    <iframe 
                        id="widget" 
                        src="http://test-tenant.localhost:3000/widget/quick-post?showContact=true&background=white"
                        allowtransparency="true">
                    </iframe>
                </div>
            </div>
        </div>

        <div class="controls-section">
            <h1>Configuration</h1>

            <div class="controls">
                <h2>Paramètres</h2>
                
                <div class="control-group">
                    <div class="control-item">
                        <label>URL de base</label>
                        <input type="text" id="baseUrl" value="http://test-tenant.localhost:3000" placeholder="http://test-tenant.localhost:3000">
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-item">
                        <label>Groups (séparés par virgule)</label>
                        <input type="text" id="groups" placeholder="groups/123,groups/456">
                    </div>
                    <div class="control-item">
                        <label>Tags (séparés par virgule)</label>
                        <input type="text" id="tags" placeholder="#FAQ,#Support">
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-item">
                        <label>Placeholder</label>
                        <input type="text" id="placeholder" placeholder="Posez votre question...">
                    </div>
                </div>

                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="showContact" checked>
                        <label for="showContact">Afficher contact</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="showFeed">
                        <label for="showFeed">Afficher feed</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="backgroundWhite" checked>
                        <label for="backgroundWhite">Fond blanc</label>
                    </div>
                </div>

                <div class="url-display" id="urlDisplay"></div>

                <button class="btn-reload" onclick="reloadWidget()">Recharger le widget</button>
            </div>

            <div class="code-section">
                <h3>Code d'intégration</h3>
                <div class="code-block">
                    <button class="btn-copy" onclick="copyCode()">Copier</button>
                    <pre id="codeDisplay"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        function buildWidgetUrl() {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const widgetPath = '/widget/quick-post';
            const params = new URLSearchParams();
            
            const groups = document.getElementById('groups').value.trim();
            if (groups) params.set('groups', groups);
            
            const tags = document.getElementById('tags').value.trim();
            if (tags) params.set('tags', tags);
            
            const placeholder = document.getElementById('placeholder').value.trim();
            if (placeholder) params.set('placeholder', placeholder);
            
            if (document.getElementById('showContact').checked) {
                params.set('showContact', 'true');
            }
            
            if (document.getElementById('showFeed').checked) {
                params.set('showFeed', 'true');
            }

            if (document.getElementById('backgroundWhite').checked) {
                params.set('background', 'white');
            }
            
            const fullUrl = baseUrl + widgetPath;
            const url = params.toString() ? `${fullUrl}?${params.toString()}` : fullUrl;
            document.getElementById('urlDisplay').textContent = url;
            
            // Générer le code d'intégration
            const code = `<iframe 
    src="${url}"
    style="width: 100%; height: 320px; border: none;"
    allowtransparency="true">
</iframe>`;
            document.getElementById('codeDisplay').textContent = code;
            
            return url;
        }

        function reloadWidget() {
            const iframe = document.getElementById('widget');
            iframe.src = buildWidgetUrl();
        }

        function copyCode() {
            const code = document.getElementById('codeDisplay').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.textContent;
                btn.textContent = 'Copié !';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Charger l'URL au démarrage
        window.addEventListener('load', () => {
            buildWidgetUrl();
        });
    </script>
</body>
</html>
